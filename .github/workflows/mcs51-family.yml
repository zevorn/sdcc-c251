name: SDCC MCS-51 family CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcs51-family-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-and-runtime:
    name: SDCC compiler, assembler and UART smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out SDCC
        uses: actions/checkout@v6

      - name: Check out Process Mission QEMU
        uses: actions/checkout@v6
        with:
          repository: processmission/qemu
          ref: 03c2e3017e25c3d1b18ada6a20e69925a89c7741
          path: qemu
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bison \
            build-essential \
            flex \
            libboost-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            libreadline-dev \
            ninja-build \
            pkg-config \
            python3-venv \
            texinfo \
            zlib1g-dev

      - name: Configure SDCC
        run: |
          mkdir sdcc-build
          cd sdcc-build
          CFLAGS=-std=gnu17 ../configure \
            --enable-mcs251-port \
            --disable-z80-port \
            --disable-z180-port \
            --disable-r2k-port \
            --disable-r2ka-port \
            --disable-r3ka-port \
            --disable-r4k-port \
            --disable-r5k-port \
            --disable-r6k-port \
            --disable-sm83-port \
            --disable-tlcs90-port \
            --disable-ez80-port \
            --disable-z80n-port \
            --disable-r800-port \
            --disable-ds390-port \
            --disable-ds400-port \
            --disable-pic14-port \
            --disable-pic16-port \
            --disable-hc08-port \
            --disable-s08-port \
            --disable-stm8-port \
            --disable-pdk13-port \
            --disable-pdk14-port \
            --disable-pdk15-port \
            --disable-mos6502-port \
            --disable-mos65c02-port \
            --disable-f8-port \
            --disable-f8l-port \
            --disable-non-free \
            --disable-sdcdb

      - name: Build SDCC
        run: make -C sdcc-build -j"$(nproc)"

      - name: Test MCS-251 instruction encodings and diagnostics
        run: make -C sdcc-build/sdas/as251 check

      - name: Test MCS-251 compiler and code generation
        run: make -C sdcc-build/src/mcs251 check

      - name: Test MCS-251 language diagnostics
        run: make -C sdcc-build/support/valdiag test-mcs251

      - name: Test all MCS-51 regression models
        run: |
          make -C sdcc-build/support/regression -j"$(nproc)" test-mcs51

      - name: Configure QEMU execution backend
        working-directory: qemu
        run: |
          ./configure \
            --target-list=mcs51-softmmu,mcs251-softmmu \
            --disable-docs \
            --disable-werror

      - name: Build QEMU execution backend
        run: |
          ninja -C qemu/build \
            qemu-system-mcs51 \
            qemu-system-mcs251

      - name: Test MCS-251 UART firmware smoke
        run: |
          make -C sdcc-build/src/mcs251 check-uart-qemu \
            QEMU_MCS251="$GITHUB_WORKSPACE/qemu/build/qemu-system-mcs251"

      - name: Test MCS-51 runtime and stability
        run: |
          make -C sdcc-build/src/mcs251 check-mcs51-qemu \
            QEMU_MCS51="$GITHUB_WORKSPACE/qemu/build/qemu-system-mcs51"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: mcs51-family-failure-logs
          path: |
            sdcc-build/support/regression/results/
            sdcc-build/support/valdiag/results/
          if-no-files-found: ignore
          retention-days: 14
