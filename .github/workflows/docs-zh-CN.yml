name: Chinese documentation

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
    paths:
      - "doc/zh-CN/**"
      - ".github/workflows/docs-zh-CN.yml"
  pull_request:
    paths:
      - "doc/zh-CN/**"
      - ".github/workflows/docs-zh-CN.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu-core \
            fonts-noto-cjk \
            pandoc \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex

      - name: Build Chinese manual
        run: make -C doc/zh-CN check all

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v5
        with:
          name: sdcc-manual-zh-CN
          path: |
            doc/zh-CN/build/sdccman-zh-CN.pdf
            doc/zh-CN/build/sdccman-zh-CN.html
          if-no-files-found: error

      - name: Publish PDF on a tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            doc/zh-CN/build/sdccman-zh-CN.pdf --clobber
