name: SDCC Windows package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Build and verify Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out SDCC
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            bison
            flex
            git
            make
            python
            texinfo
          pacboy: >-
            boost:p
            toolchain:p
            zlib:p

      - name: Configure SDCC for Windows
        shell: msys2 {0}
        run: |
          mkdir windows-build
          cd windows-build
          CFLAGS=-std=gnu17 LDFLAGS=-static ../configure \
            --enable-mcs251-port \
            --prefix=/sdcc \
            --datarootdir=/sdcc \
            'docdir=${datarootdir}/doc' \
            include_dir_suffix=include \
            non_free_include_dir_suffix=non-free/include \
            lib_dir_suffix=lib \
            non_free_lib_dir_suffix=non-free/lib \
            'sdccconf_h_dir_separator=\\' \
            --disable-z80-port \
            --disable-z180-port \
            --disable-r2k-port \
            --disable-r2ka-port \
            --disable-r3ka-port \
            --disable-r4k-port \
            --disable-r5k-port \
            --disable-r6k-port \
            --disable-sm83-port \
            --disable-tlcs90-port \
            --disable-ez80-port \
            --disable-z80n-port \
            --disable-r800-port \
            --disable-ds390-port \
            --disable-ds400-port \
            --disable-pic14-port \
            --disable-pic16-port \
            --disable-hc08-port \
            --disable-s08-port \
            --disable-stm8-port \
            --disable-pdk13-port \
            --disable-pdk14-port \
            --disable-pdk15-port \
            --disable-mos6502-port \
            --disable-mos65c02-port \
            --disable-f8-port \
            --disable-f8l-port \
            --disable-ucsim \
            --disable-sdcdb \
            --disable-non-free

      - name: Build and install Windows package
        shell: msys2 {0}
        run: |
          make -C windows-build -j2 sdcc-base
          install -m 755 windows-build/support/cpp/gcc/cpp.exe \
            windows-build/bin/sdcpp.exe
          install -m 755 windows-build/support/cpp/gcc/cc1.exe \
            windows-build/bin/cc1.exe
          make -C windows-build -j2
          make -C windows-build \
            DESTDIR="$PWD/windows-build/windows-stage" install
          mkdir -p windows-package/sdcc-mcs251
          cp -a windows-build/windows-stage/sdcc/. \
            windows-package/sdcc-mcs251/
          cp README.md COPYING sdas/COPYING3 windows-package/sdcc-mcs251/

      - name: Verify the package outside MSYS2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:GITHUB_WORKSPACE `
            "windows-package\sdcc-mcs251"
          $sdcc = Join-Path $package "bin\sdcc.exe"
          $requiredExecutables = @(
            "sdcc.exe",
            "sdcpp.exe",
            "sdas8051.exe",
            "sdas251.exe",
            "sdld.exe"
          )
          foreach ($executable in $requiredExecutables) {
            if (-not (Test-Path (Join-Path $package "bin\$executable"))) {
              throw "the Windows package is missing $executable"
            }
          }

          $requiredLibraries = @(
            "mcs251-small",
            "mcs251-small-stack-auto",
            "mcs251-large",
            "mcs251-large-stack-auto"
          )
          foreach ($library in $requiredLibraries) {
            if (-not (Test-Path (Join-Path $package "lib\$library"))) {
              throw "the Windows package is missing $library"
            }
          }

          $version = & $sdcc --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "sdcc.exe --version failed"
          }
          $version | Write-Host
          $versionText = $version -join "`n"
          if ($versionText -notmatch "mcs51" -or `
              $versionText -notmatch "mcs251") {
            throw "the Windows compiler does not contain both target ports"
          }

          $searchDirs = & $sdcc --print-search-dirs 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "sdcc.exe --print-search-dirs failed"
          }
          $searchDirs | Write-Host

          $smokeDir = Join-Path $env:RUNNER_TEMP "sdcc-windows-smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $source = Join-Path $smokeDir "main.c"
          "void main(void) { for (;;) {} }" |
            Set-Content -Encoding ascii -Path $source

          $builds = @(
            @{ Name = "mcs51"; Flags = @("-mmcs51", "--model-small") },
            @{ Name = "mcs251-small";
               Flags = @("-mmcs251", "--model-small") },
            @{ Name = "mcs251-small-stack-auto";
               Flags = @("-mmcs251", "--model-small", "--stack-auto") },
            @{ Name = "mcs251-large";
               Flags = @("-mmcs251", "--model-large") },
            @{ Name = "mcs251-large-stack-auto";
               Flags = @("-mmcs251", "--model-large", "--stack-auto") }
          )
          foreach ($build in $builds) {
            $image = Join-Path $smokeDir "$($build.Name).ihx"
            $arguments = $build.Flags + @("-o", $image, $source)
            & $sdcc @arguments
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $image)) {
              throw "the packaged compiler failed to build $($build.Name)"
            }
          }

      - name: Create Windows ZIP package
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE `
            "sdcc-mcs251-windows-x64-${{ github.sha }}.zip"
          Compress-Archive -Path "windows-package\sdcc-mcs251" `
            -DestinationPath $archive

      - name: Upload Windows ZIP package
        uses: actions/upload-artifact@v7
        with:
          path: sdcc-mcs251-windows-x64-${{ github.sha }}.zip
          archive: false
          retention-days: 30

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          $archive = "sdcc-mcs251-windows-x64-${{ github.sha }}.zip"
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $tagInfo = gh api ("repos/" + $repo + "/git/ref/tags/" + $tag) | ConvertFrom-Json
          if ($tagInfo.object.type -eq "tag") {
            $tagObject = gh api ("repos/" + $repo + "/git/tags/" + $tagInfo.object.sha) | ConvertFrom-Json
            $tagObject.message | Set-Content -Encoding utf8 $notesFile
          } else {
            ("SDCC MCS-251 (C251) port package for " + $tag) | Set-Content -Encoding utf8 $notesFile
          }
          gh release view $tag --repo $repo | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $repo --title $tag --notes-file $notesFile
            gh release upload $tag $archive --repo $repo --clobber
          } else {
            gh release create $tag $archive --repo $repo --title $tag --notes-file $notesFile
          }
